services:
    app:
        build:
            args:
                user: sammy
                uid: 1000
            context: ./
            dockerfile: Dockerfile
        image: laravel-blog
        container_name: laravel-blog-app
        restart: unless-stopped
        working_dir: /var/www/
        env_file:
            - .env.local
        depends_on:
            db:
                condition: service_healthy
        volumes:
            - ./:/var/www
            - vendor:/var/www/vendor
        networks:
            - app-network

    db:
        image: mysql:9.1
        container_name: laravel-blog-db
        restart: unless-stopped
        env_file:
            - .env.local
        environment:
            MYSQL_DATABASE: ${DB_DATABASE:-laravel_blog}
            MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-password}
            MYSQL_PASSWORD: ${DB_PASSWORD:-password}
            MYSQL_USER: ${DB_USERNAME:-laravel_blog_user}
            SERVICE_TAGS: dev
            SERVICE_NAME: mysql
        healthcheck:
            test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$$MYSQL_USER -p$$MYSQL_PASSWORD --silent"]
            interval: 5s
            timeout: 5s
            retries: 20
        ports:
            - "3306:3306"
        volumes:
            - ./docker-compose/mysql:/docker-entrypoint-initdb.d
            - dbdata:/var/lib/mysql
        networks:
            - app-network

    nginx:
        image: nginx:1.27-alpine
        container_name: laravel-blog-nginx
        restart: unless-stopped
        depends_on:
            - app
        ports:
            - "8000:80"
        volumes:
            - ./:/var/www
            - ./docker-compose/nginx:/etc/nginx/conf.d
        networks:
            - app-network

    scheduler:
        image: laravel-blog
        container_name: laravel-blog-scheduler
        restart: unless-stopped
        working_dir: /var/www/
        env_file:
            - .env.local
        depends_on:
            db:
                condition: service_healthy
            app:
                condition: service_started
        volumes:
            - ./:/var/www
            - vendor:/var/www/vendor
        command: php artisan schedule:work
        networks:
            - app-network

volumes:
    dbdata:
    vendor:

networks:
    app-network:
        driver: bridge
